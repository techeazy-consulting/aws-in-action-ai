  HelpdeskUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${Project}-${Environment}-users"
      # People are added by the administrator; nobody can create their own account.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      # An email address is not trusted until Cognito has verified it, and a change to it must be
      # verified before it takes effect. The administrator marks each person's address verified.
      AutoVerifiedAttributes:
        - email
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email
      Policies:
        PasswordPolicy:
          MinimumLength: 12
      UserPoolTags:
        chapter: session-07
        project: !Ref Project
        environment: !Ref Environment

  HelpdeskUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref HelpdeskUserPool
      ClientName: !Sub "${Project}-${Environment}-chat"
      # A browser cannot keep a secret, so this client has none. The sign-in function sends the
      # password to Cognito over HTTPS; refresh tokens are not handed to the page.
      GenerateSecret: false
      # What this client may read and write. Email is readable (the token carries it) but not
      # writable: left unset, the app client could change any standard attribute, email included.
      ReadAttributes:
        - email
        - email_verified
        - name
      WriteAttributes:
        - name
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

