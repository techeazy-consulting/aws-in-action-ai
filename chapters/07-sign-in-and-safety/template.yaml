  SigninFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Project}-${Environment}-signin"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt SigninFunctionRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CLIENT_ID: !Ref HelpdeskUserPoolClient
      LoggingConfig:
        LogGroup: !Ref SigninFunctionLogGroup
      Code:
        ZipFile: |
          import json
          import logging
          import os

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          cognito = boto3.client("cognito-idp")
          CLIENT_ID = os.environ["CLIENT_ID"]
          MAX_EMAIL = 254
          MAX_PASSWORD = 256
          # Cognito's answers that mean "those details did not work". All of them get one message, so the
          # reply never says whether an email address has an account.
          REFUSED = {"NotAuthorizedException", "UserNotFoundException", "UserNotConfirmedException"}


          def reply(status, body):
              return {
                  "statusCode": status,
                  "headers": {"content-type": "application/json", "cache-control": "no-store"},
                  "body": json.dumps(body),
              }


          def handler(event, context):
              # The password is read, passed on and dropped. It is never logged, stored or sent back.
              try:
                  body = json.loads(event.get("body") or "{}")
                  email, password = body.get("email"), body.get("password")
              except (ValueError, AttributeError):
                  email = password = None
              if not isinstance(email, str) or not isinstance(password, str):
                  return reply(400, {"error": 'Send JSON like {"email": "...", "password": "..."}'})
              email = email.strip()
              if not email or not password or len(email) > MAX_EMAIL or len(password) > MAX_PASSWORD:
                  return reply(400, {"error": "Enter your email and password."})

              try:
                  response = cognito.initiate_auth(
                      AuthFlow="USER_PASSWORD_AUTH",
                      ClientId=CLIENT_ID,
                      AuthParameters={"USERNAME": email, "PASSWORD": password},
                  )
              except Exception as err:
                  code = getattr(err, "response", {}).get("Error", {}).get("Code")
                  if code in REFUSED:
                      return reply(401, {"error": "Wrong email or password."})
                  logger.error("sign-in call failed: %s", type(err).__name__)  # the name only, never details
                  return reply(502, {"error": "Sign-in is unavailable. Try again."})

              result = response.get("AuthenticationResult") if isinstance(response, dict) else None
              token = result.get("IdToken") if isinstance(result, dict) else None
              if not isinstance(token, str) or not token:
                  # A challenge, such as a forced password change, is not a sign-in. Nothing is issued.
                  challenge = response.get("ChallengeName") if isinstance(response, dict) else None
                  logger.info("sign-in needs a step this page does not do: %s", challenge)
                  return reply(409, {"error": "Your account needs a password change. Ask IT."})
              expires = result.get("ExpiresIn")
              # Only the ID token goes to the page. The access and refresh tokens stay here and are dropped.
              return reply(
                  200, {"id_token": token, "expires_in": expires if isinstance(expires, int) else None}
              )
      Tags:
        - Key: chapter
          Value: session-07
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  SigninIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HelpdeskApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SigninFunction.Arn
      PayloadFormatVersion: "2.0"

  SigninRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HelpdeskApi
      RouteKey: POST /signin
      Target: !Sub "integrations/${SigninIntegration}"

  SigninInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SigninFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HelpdeskApi}/*/POST/signin"

  HelpdeskGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub "${Project}-${Environment}-guardrail"
      Description: Masks pasted passwords and keys and blocks requests that are not about IT.
      BlockedInputMessaging: This helpdesk only helps with workplace IT. Ask an IT question.
      BlockedOutputsMessaging: I cannot share that answer. Ask an IT question another way.
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - Type: PASSWORD
            Action: ANONYMIZE
            InputAction: ANONYMIZE
            InputEnabled: true
            OutputAction: ANONYMIZE
            OutputEnabled: true
          - Type: AWS_ACCESS_KEY
            Action: ANONYMIZE
            InputAction: ANONYMIZE
            InputEnabled: true
            OutputAction: ANONYMIZE
            OutputEnabled: true
          - Type: AWS_SECRET_KEY
            Action: ANONYMIZE
            InputAction: ANONYMIZE
            InputEnabled: true
            OutputAction: ANONYMIZE
            OutputEnabled: true
        RegexesConfig:
          - Name: private-key-header
            Description: The first line of a pasted private key
            Pattern: "-----BEGIN [A-Z ]*PRIVATE KEY-----"
            Action: ANONYMIZE
            InputAction: ANONYMIZE
            InputEnabled: true
            OutputAction: ANONYMIZE
            OutputEnabled: true
      TopicPolicyConfig:
        TopicsConfig:
          - Name: Requests that are not about workplace IT
            Definition: Medical, legal, investment or political advice, and requests to write essays, stories or code on general subjects.
            Examples:
              - Should I invest in this stock?
              - Write my essay about the French revolution.
              - What medicine should I take for a headache?
            Type: DENY
            InputAction: BLOCK
            InputEnabled: true
            OutputAction: BLOCK
            OutputEnabled: true
      Tags:
        - Key: chapter
          Value: session-07
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  HelpdeskGuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt HelpdeskGuardrail.GuardrailId
      Description: The version the functions call. Edit the guardrail, then update this to publish a new one.

