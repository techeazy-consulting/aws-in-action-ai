  SigninFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: signin-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Nothing else: the sign-in call to Cognito is not authorised by IAM at all.
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt SigninFunctionLogGroup.Arn
      Tags:
        - Key: chapter
          Value: session-07
        - Key: project
