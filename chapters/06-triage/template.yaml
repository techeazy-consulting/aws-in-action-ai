AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Helpdesk assistant, chapter 6. POST /ask asks a knowledge base built from the IT policy
  pages and returns a cited answer. POST /tickets lets the model open and look up tickets in a
  DynamoDB table through tool use. POST /triage runs a tool-use loop that checks a service,
  tries a known fix and, if that is not enough, emails the IT team through an SNS topic. The
  chat page, in a private bucket behind CloudFront, shows the cited page beside the answer.
Parameters:
  Project:
    Type: String
    Default: helpdesk
    AllowedPattern: "^[a-z][a-z0-9-]{1,19}$"
    Description: Short project name, lowercase. Starts every resource name, for example helpdesk-dev-ask.
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, test, prod]
    Description: Which copy this stack is. Deploy once per environment, each as its own stack.
  ModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    AllowedValues:
      - amazon.nova-lite-v1:0
      - amazon.nova-micro-v1:0
    Description: >-
      The model that answers. Nova Lite works in every Region in the RegionRoute list. Nova Micro has
      no Asia Pacific route. To switch later, update the stack and pick another value here; editing the
      function's MODEL_ID alone fails, because the role only allows the model chosen here.
  ModelRoute:
    Type: String
    Default: auto
    AllowedValues: [auto, direct, us, eu, apac, ca]
    Description: >-
      How the call reaches the model. auto picks the route for this Region from RegionRoute. direct
      calls the model id as it is (only where the model page shows In-Region support); us, eu, apac
      and ca call that geography's inference profile.

  EscalationEmail:
    Type: String
    AllowedPattern: "[^@\\s]+@[^@\\s]+\\.[^@\\s]+"
    ConstraintDescription: Enter an email address you can read.
    Description: Address that receives escalations. No default; you must pass your own.
  ServiceStatus:
    Type: String
    Default: '{"email": "up", "vpn": "down", "wiki": "up", "printing": "up"}'
    Description: JSON the status check reads. Change a value and update the stack to move an outage.

Mappings:
  # The route each Region uses for Nova Lite, from the model page's Regional availability table.
  RegionRoute:
    us-east-1: {Route: us}
    us-east-2: {Route: us}
    us-west-1: {Route: us}
    us-west-2: {Route: us}
    ca-central-1: {Route: ca}
    ca-west-1: {Route: ca}
    eu-central-1: {Route: eu}
    eu-north-1: {Route: eu}
    eu-south-1: {Route: eu}
    eu-south-2: {Route: eu}
    eu-west-1: {Route: eu}
    eu-west-2: {Route: direct}
    eu-west-3: {Route: eu}
    il-central-1: {Route: eu}
    ap-northeast-1: {Route: apac}
    ap-northeast-2: {Route: apac}
    ap-south-1: {Route: apac}
    ap-southeast-1: {Route: apac}
    ap-southeast-2: {Route: apac}
    ap-southeast-3: {Route: apac}
    me-central-1: {Route: direct}

Conditions:
  RouteIsAuto: !Equals [!Ref ModelRoute, auto]
  CallsModelDirectly: !Or
    - !Equals [!Ref ModelRoute, direct]
    - !And
      - !Condition RouteIsAuto
      - !Equals [!FindInMap [RegionRoute, !Ref "AWS::Region", Route], direct]
  CallsInferenceProfile: !Not [!Condition CallsModelDirectly]

Resources:
  AskFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Project}-${Environment}-ask"
      RetentionInDays: 7
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  AskFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ask-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt AskFunctionLogGroup.Arn
              - Sid: CallTheChosenModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !If
                  - CallsInferenceProfile
                  - - !Sub
                      - "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${Id}"
                      - Id: !Join [".", [!If [RouteIsAuto, !FindInMap [RegionRoute, !Ref "AWS::Region", Route], !Ref ModelRoute], !Ref ModelId]]
                    # a profile may send the call to any Region in its geography
                    - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${ModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
              - Sid: AskTheKnowledgeBase
                Effect: Allow
                Action: bedrock:RetrieveAndGenerate
                Resource: "*"
              - Sid: ReadOnlyThisKnowledgeBase
                Effect: Allow
                Action: bedrock:Retrieve
                Resource: !GetAtt PolicyKnowledgeBase.KnowledgeBaseArn
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  AskFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Project}-${Environment}-ask"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt AskFunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          KNOWLEDGE_BASE_ID: !Ref PolicyKnowledgeBase
          MODEL_ARN: !If
            - CallsInferenceProfile
            - !Sub
              - "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${Id}"
              - Id: !Join [".", [!If [RouteIsAuto, !FindInMap [RegionRoute, !Ref "AWS::Region", Route], !Ref ModelRoute], !Ref ModelId]]
            - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
      LoggingConfig:
        LogGroup: !Ref AskFunctionLogGroup
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import re

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          agent = boto3.client("bedrock-agent-runtime")
          KNOWLEDGE_BASE_ID = os.environ["KNOWLEDGE_BASE_ID"]
          MODEL_ARN = os.environ["MODEL_ARN"]
          MAX_QUESTION = 1000  # the endpoint is public until sign-in (ch 7); long input costs money
          MAX_EXCERPT = 300
          # Only pages from the policy folder are passed to the browser, whatever the knowledge base returns.
          PAGE_KEY = re.compile(r"^policies/[A-Za-z0-9._-]+\.html$")


          def reply(status, body):
              return {
                  "statusCode": status,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps(body),
              }


          def sources(citations):
              """The distinct policy pages behind an answer, each with the passage that was used."""
              found = {}
              for citation in citations:
                  for reference in citation.get("retrievedReferences", []):
                      uri = ((reference.get("location") or {}).get("s3Location") or {}).get("uri") or ""
                      parts = uri.split("/", 3)
                      key = parts[3] if uri.startswith("s3://") and len(parts) == 4 else ""
                      if PAGE_KEY.match(key) and key not in found:
                          text = (reference.get("content") or {}).get("text") or ""
                          found[key] = {"page": key, "excerpt": text[:MAX_EXCERPT]}
              return list(found.values())


          def handler(event, context):
              try:
                  question = json.loads(event.get("body") or "{}").get("question")
              except (ValueError, AttributeError):
                  question = None
              if not isinstance(question, str) or not question.strip():
                  return reply(400, {"error": 'Send JSON like {"question": "..."}'})
              if len(question) > MAX_QUESTION:
                  return reply(400, {"error": f"Keep the question under {MAX_QUESTION} characters"})

              try:
                  response = agent.retrieve_and_generate(
                      input={"text": question},
                      retrieveAndGenerateConfiguration={
                          "type": "KNOWLEDGE_BASE",
                          "knowledgeBaseConfiguration": {
                              "knowledgeBaseId": KNOWLEDGE_BASE_ID,
                              "modelArn": MODEL_ARN,
                              "generationConfiguration": {
                                  "inferenceConfig": {
                                      "textInferenceConfig": {"maxTokens": 400, "temperature": 0.2}
                                  }
                              },
                          },
                      },
                  )
                  answer = response["output"]["text"]
                  cited = sources(response.get("citations", []))
              except Exception:
                  logger.exception("knowledge base call failed")
                  return reply(502, {"error": "The assistant is unavailable. Try again."})

              logger.info("answered a question of %d characters from %d pages", len(question), len(cited))
              return reply(200, {"answer": answer, "sources": cited})
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  HelpdeskApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${Project}-${Environment}-api"
      ProtocolType: HTTP
      Tags:
        chapter: session-06
        project: !Ref Project
        environment: !Ref Environment

  AskIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HelpdeskApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AskFunction.Arn
      PayloadFormatVersion: "2.0"

  AskRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HelpdeskApi
      RouteKey: POST /ask
      Target: !Sub "integrations/${AskIntegration}"

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HelpdeskApi
      StageName: $default
      AutoDeploy: true
      # Public until sign-in (ch 7): cap requests so a leaked URL cannot run up the bill
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 1
      Tags:
        chapter: session-06
        project: !Ref Project
        environment: !Ref Environment

  AskInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AskFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HelpdeskApi}/*/POST/ask"

  TicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TicketId
          AttributeType: S
      KeySchema:
        - AttributeName: TicketId
          KeyType: HASH
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  TicketsFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Project}-${Environment}-tickets"
      RetentionInDays: 7
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  TicketsFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: tickets-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt TicketsFunctionLogGroup.Arn
              - Sid: CallTheChosenModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !If
                  - CallsInferenceProfile
                  - - !Sub
                      - "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${Id}"
                      - Id: !Join [".", [!If [RouteIsAuto, !FindInMap [RegionRoute, !Ref "AWS::Region", Route], !Ref ModelRoute], !Ref ModelId]]
                    # a profile may send the call to any Region in its geography
                    - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${ModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
              - Sid: ReadAndWriteTicketsOnly
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt TicketsTable.Arn
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  TicketsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Project}-${Environment}-tickets"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt TicketsFunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          TICKETS_TABLE: !Ref TicketsTable
          MODEL_ID: !If
            - CallsInferenceProfile
            - !Join [".", [!If [RouteIsAuto, !FindInMap [RegionRoute, !Ref "AWS::Region", Route], !Ref ModelRoute], !Ref ModelId]]
            - !Ref ModelId
      LoggingConfig:
        LogGroup: !Ref TicketsFunctionLogGroup
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import re

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          bedrock = boto3.client("bedrock-runtime")
          dynamodb = boto3.client("dynamodb")
          TABLE = os.environ["TICKETS_TABLE"]
          MODEL_ID = os.environ["MODEL_ID"]
          MAX_MESSAGE = 1000  # the endpoint is public until sign-in (ch 7); long input costs money
          MAX_ROUNDS = 3  # model calls per request: ask, read the tool result, answer
          FIRST_NUMBER = 1000  # the first ticket is 1001
          COUNTER_KEY = "counter"  # one extra item in the table that counts tickets
          TICKET_ID = re.compile(r"^[0-9]{4,9}$")  # keeps "counter" out of reach of get_ticket_status

          SYSTEM = [
              {
                  "text": "You are an IT helpdesk assistant. To open a ticket you need a short title and "
                  "the name of the person asking. If either is missing, ask for it instead of guessing. "
                  "To check a ticket, use its number. Never invent a ticket number or a status."
              }
          ]

          TOOL_CONFIG = {
              "tools": [
                  {
                      "toolSpec": {
                          "name": "create_ticket",
                          "description": "Open a new IT ticket and return its number.",
                          "inputSchema": {
                              "json": {
                                  "type": "object",
                                  "properties": {
                                      "title": {"type": "string", "description": "What the person needs."},
                                      "requester": {"type": "string", "description": "Who is asking."},
                                  },
                                  "required": ["title", "requester"],
                              }
                          },
                      }
                  },
                  {
                      "toolSpec": {
                          "name": "get_ticket_status",
                          "description": "Look up an existing ticket by number and return its status.",
                          "inputSchema": {
                              "json": {
                                  "type": "object",
                                  "properties": {
                                      "ticket_id": {"type": "string", "description": "For example 1042."}
                                  },
                                  "required": ["ticket_id"],
                              }
                          },
                      }
                  },
              ]
          }


          class ToolError(Exception):
              """A problem the model can read and explain to the person, such as a missing detail."""


          def reply(status, body):
              return {
                  "statusCode": status,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps(body),
              }


          def text_field(args, name, limit):
              value = args.get(name)
              if not isinstance(value, str) or not value.strip():
                  raise ToolError(f"Missing detail: {name}. Ask the person for it.")
              return value.strip()[:limit]


          def create_ticket(args):
              title = text_field(args, "title", 200)
              requester = text_field(args, "requester", 100)
              # ADD on a number adds to it, and starts from 0 when the item or attribute is not there yet.
              counted = dynamodb.update_item(
                  TableName=TABLE,
                  Key={"TicketId": {"S": COUNTER_KEY}},
                  UpdateExpression="ADD LastNumber :one",
                  ExpressionAttributeValues={":one": {"N": "1"}},
                  ReturnValues="UPDATED_NEW",
              )
              ticket_id = str(FIRST_NUMBER + int(counted["Attributes"]["LastNumber"]["N"]))
              dynamodb.put_item(
                  TableName=TABLE,
                  Item={
                      "TicketId": {"S": ticket_id},
                      "Title": {"S": title},
                      "Requester": {"S": requester},
                      "Status": {"S": "open"},
                  },
                  ConditionExpression="attribute_not_exists(TicketId)",
              )
              return {"ticket_id": ticket_id, "status": "open"}


          def get_ticket_status(args):
              ticket_id = str(args.get("ticket_id") or "").strip()
              if not TICKET_ID.fullmatch(ticket_id):
                  raise ToolError("Missing detail: a ticket number such as 1042. Ask the person for it.")
              found = dynamodb.get_item(
                  TableName=TABLE, Key={"TicketId": {"S": ticket_id}}, ConsistentRead=True
              )
              item = found.get("Item")  # no Item in the response means no such ticket
              if not item:
                  raise ToolError(f"There is no ticket {ticket_id}.")
              return {
                  "ticket_id": ticket_id,
                  "title": item["Title"]["S"],
                  "status": item["Status"]["S"],
              }


          TOOLS = {"create_ticket": create_ticket, "get_ticket_status": get_ticket_status}


          def run_tool(tool_use):
              """Run one tool the model asked for. Always returns a toolResult block, never raises."""
              name = tool_use.get("name")
              args = tool_use.get("input")
              result = {"toolUseId": tool_use["toolUseId"]}
              try:
                  if name not in TOOLS:
                      raise ToolError(f"There is no tool called {name}.")
                  output = TOOLS[name](args if isinstance(args, dict) else {})
                  result["content"] = [{"json": output}]
              except ToolError as err:
                  result["content"] = [{"text": str(err)}]
                  result["status"] = "error"
              except Exception:
                  logger.exception("tool %s failed", name)
                  result["content"] = [{"text": "The ticket system is unavailable right now."}]
                  result["status"] = "error"
              return {"toolResult": result}


          def words(message):
              return "".join(block.get("text", "") for block in message.get("content", []))


          def handler(event, context):
              try:
                  text = json.loads(event.get("body") or "{}").get("message")
              except (ValueError, AttributeError):
                  text = None
              if not isinstance(text, str) or not text.strip():
                  return reply(400, {"error": 'Send JSON like {"message": "..."}'})
              if len(text) > MAX_MESSAGE:
                  return reply(400, {"error": f"Keep the message under {MAX_MESSAGE} characters"})

              messages = [{"role": "user", "content": [{"text": text}]}]
              used = []
              for _ in range(MAX_ROUNDS):
                  try:
                      response = bedrock.converse(
                          modelId=MODEL_ID,
                          messages=messages,
                          system=SYSTEM,
                          toolConfig=TOOL_CONFIG,
                          inferenceConfig={"maxTokens": 400, "temperature": 0.2},
                      )
                      message = response["output"]["message"]
                      stop_reason = response["stopReason"]
                  except Exception:
                      logger.exception("model call failed")
                      return reply(502, {"error": "The assistant is unavailable. Try again."})
                  messages.append(message)
                  if stop_reason != "tool_use":
                      logger.info("answered after %d tool calls", len(used))
                      return reply(200, {"answer": words(message), "tools_used": used})
                  results = []
                  for block in message.get("content", []):
                      if "toolUse" in block:
                          used.append(block["toolUse"].get("name"))
                          results.append(run_tool(block["toolUse"]))
                  if not results:
                      break
                  messages.append({"role": "user", "content": results})

              logger.error("no final answer after %d model calls", MAX_ROUNDS)
              return reply(502, {"error": "The assistant could not finish. Try again."})
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  TicketsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HelpdeskApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TicketsFunction.Arn
      PayloadFormatVersion: "2.0"

  TicketsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HelpdeskApi
      RouteKey: POST /tickets
      Target: !Sub "integrations/${TicketsIntegration}"

  TicketsInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TicketsFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HelpdeskApi}/*/POST/tickets"

  EscalationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${Project}-${Environment}-escalations"
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  EscalationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref EscalationTopic
      Protocol: email
      Endpoint: !Ref EscalationEmail

  TriageFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Project}-${Environment}-triage"
      RetentionInDays: 7
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  TriageFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: triage-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt TriageFunctionLogGroup.Arn
              - Sid: CallTheChosenModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !If
                  - CallsInferenceProfile
                  - - !Sub
                      - "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${Id}"
                      - Id: !Join [".", [!If [RouteIsAuto, !FindInMap [RegionRoute, !Ref "AWS::Region", Route], !Ref ModelRoute], !Ref ModelId]]
                    # a profile may send the call to any Region in its geography
                    - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/${ModelId}"
                  - !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${ModelId}"
              - Sid: PublishToTheEscalationTopicOnly
                Effect: Allow
                Action: sns:Publish
                Resource: !Ref EscalationTopic
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  TriageFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${Project}-${Environment}-triage"
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt TriageFunctionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ESCALATION_TOPIC_ARN: !Ref EscalationTopic
          MODEL_ID: !If
            - CallsInferenceProfile
            - !Join [".", [!If [RouteIsAuto, !FindInMap [RegionRoute, !Ref "AWS::Region", Route], !Ref ModelRoute], !Ref ModelId]]
            - !Ref ModelId
          SERVICE_STATUS: !Ref ServiceStatus
      LoggingConfig:
        LogGroup: !Ref TriageFunctionLogGroup
      Code:
        ZipFile: |
          import json
          import logging
          import os
          import re
          import unicodedata

          import boto3

          logger = logging.getLogger()
          logger.setLevel(logging.INFO)

          bedrock = boto3.client("bedrock-runtime")
          sns = boto3.client("sns")
          TOPIC_ARN = os.environ["ESCALATION_TOPIC_ARN"]
          MODEL_ID = os.environ["MODEL_ID"]
          SERVICE_STATUS = os.environ.get("SERVICE_STATUS", "{}")  # JSON from the template: {"vpn": "down"}
          MAX_MESSAGE = 1000  # the endpoint is public until sign-in (ch 7); long input costs money
          MAX_STEPS = 6  # model calls per request. The loop never runs longer than this.
          MAX_ESCALATIONS = 1  # emails per request, whatever the model asks for: a prompt cannot spam the topic

          # Pages from chapter 4 that carry the known fixes; the person is pointed at one of them.
          KNOWN_FIXES = {
              "password": {
                  "fix": "Send the person to the password reset page.",
                  "page": "policies/password-reset.html",
              },
              "vpn": {"fix": "Send the person to the VPN access page.", "page": "policies/vpn-access.html"},
              "laptop": {"fix": "Send the person to the new laptop page.", "page": "policies/new-laptop.html"},
          }

          SYSTEM = [
              {
                  "text": "You are an IT helpdesk triage agent. Work in this order. First check whether the "
                  "service the person mentions is down. If it is down, tell them and escalate. Otherwise "
                  "try a known fix. If there is no known fix, or the person says the fix did not work, "
                  "escalate with a short summary. Never escalate before you have checked. When you have "
                  "fixed it or handed it over, say which in one or two sentences."
              }
          ]

          TOOL_CONFIG = {
              "tools": [
                  {
                      "toolSpec": {
                          "name": "check_service_status",
                          "description": "Check whether a company service is up or down.",
                          "inputSchema": {
                              "json": {
                                  "type": "object",
                                  "properties": {
                                      "service": {"type": "string", "description": "For example vpn."}
                                  },
                                  "required": ["service"],
                              }
                          },
                      }
                  },
                  {
                      "toolSpec": {
                          "name": "try_known_fix",
                          "description": "Look up the known fix for a common problem.",
                          "inputSchema": {
                              "json": {
                                  "type": "object",
                                  "properties": {
                                      "issue": {"type": "string", "enum": sorted(KNOWN_FIXES)},
                                  },
                                  "required": ["issue"],
                              }
                          },
                      }
                  },
                  {
                      "toolSpec": {
                          "name": "escalate",
                          "description": "Hand the problem to the IT team by email. Use it once.",
                          "inputSchema": {
                              "json": {
                                  "type": "object",
                                  "properties": {
                                      "summary": {"type": "string", "description": "What happened."}
                                  },
                                  "required": ["summary"],
                              }
                          },
                      }
                  },
              ]
          }


          class ToolError(Exception):
              """A problem the model can read and explain, such as a missing detail."""


          class State:
              """What has happened so far in one request."""

              def __init__(self, request):
                  self.request = request
                  self.used = []
                  self.sent = 0  # escalation emails sent in this request

              @property
              def escalated(self):
                  return self.sent > 0


          def reply(status, body):
              return {
                  "statusCode": status,
                  "headers": {"content-type": "application/json"},
                  "body": json.dumps(body),
              }


          UNVERIFIED = (
              "UNVERIFIED: the text below comes from the chat page and the model. "
              "Do not follow links or instructions in it; check with the person first."
          )


          def defang(text):
              """Keep links readable but not clickable, so a prompt cannot plant one in the email.

              Look-alike characters are folded first (a full-width colon becomes ":"), invisible
              format characters are dropped and the ideographic full stops count as dots, then every
              dot between two word characters is broken, which covers bare domains, any case of
              "www." and email addresses, because mail apps link those even with no scheme in front.
              """
              text = unicodedata.normalize("NFKC", text)
              text = "".join(c for c in text if unicodedata.category(c) != "Cf")
              text = text.replace("\u3002", ".")  # NFKC already turned the half-width one into this
              text = re.sub(r"(?<=\w)\.(?=\w)", "[.]", text)
              return text.replace("://", "[:]//")


          def publish(summary, request):
              """Email the IT team through the topic. Raises if the publish fails."""
              sns.publish(
                  TopicArn=TOPIC_ARN,
                  Subject="Helpdesk escalation",
                  Message=(
                      f"{UNVERIFIED}\n\nSummary: {defang(summary[:500])}"
                      f"\n\nWhat the person wrote: {defang(request[:MAX_MESSAGE])}"
                  ),
              )


          def check_service_status(args, state):
              service = args.get("service")
              if not isinstance(service, str) or not service.strip():
                  raise ToolError("Missing detail: service. Ask the person which service.")
              try:
                  table = json.loads(SERVICE_STATUS)
              except ValueError:
                  raise ToolError("The status list is unreadable.")
              status = table.get(service.strip().lower()) if isinstance(table, dict) else None
              if status is None:
                  raise ToolError(f"There is no status for {service.strip()[:50]}.")
              return {"service": service.strip().lower(), "status": status}


          def try_known_fix(args, state):
              fix = KNOWN_FIXES.get(args.get("issue"))
              if fix is None:
                  raise ToolError("There is no known fix for that. Escalate.")
              return fix


          def escalate(args, state):
              summary = args.get("summary")
              if not isinstance(summary, str) or not summary.strip():
                  raise ToolError("Missing detail: summary. Write a short summary first.")
              if state.sent >= MAX_ESCALATIONS:
                  return {"escalated": True, "note": "Already handed over; nothing more was sent."}
              publish(summary.strip(), state.request)
              state.sent += 1
              return {"escalated": True}


          TOOLS = {
              "check_service_status": check_service_status,
              "try_known_fix": try_known_fix,
              "escalate": escalate,
          }


          def run_tool(tool_use, state):
              """Run one tool the model asked for. Always returns a toolResult block, never raises."""
              name = tool_use.get("name")
              args = tool_use.get("input")
              result = {"toolUseId": tool_use["toolUseId"]}
              try:
                  if name not in TOOLS:
                      raise ToolError(f"There is no tool called {name}.")
                  output = TOOLS[name](args if isinstance(args, dict) else {}, state)
                  result["content"] = [{"json": output}]
              except ToolError as err:
                  result["content"] = [{"text": str(err)}]
                  result["status"] = "error"
              except Exception:
                  logger.exception("tool %s failed", name)
                  result["content"] = [{"text": "That tool is unavailable right now."}]
                  result["status"] = "error"
              return {"toolResult": result}


          def words(message):
              return "".join(block.get("text", "") for block in message.get("content", []))


          def hand_over(state, reason):
              """The code's own rule: when the loop cannot finish, a person takes over."""
              if state.sent < MAX_ESCALATIONS:
                  try:
                      publish(f"The assistant stopped without an answer ({reason}).", state.request)
                  except Exception:
                      logger.exception("hand-over failed")
                      return reply(502, {"error": "The assistant is unavailable. Try again."})
                  state.sent += 1
              logger.info("handed over: %s", reason)
              return reply(
                  200,
                  {
                      "answer": "I could not settle this myself, so I passed it to the IT team.",
                      "steps": state.used,
                      "escalated": True,
                      "reason": reason,
                  },
              )


          def handler(event, context):
              try:
                  text = json.loads(event.get("body") or "{}").get("message")
              except (ValueError, AttributeError):
                  text = None
              if not isinstance(text, str) or not text.strip():
                  return reply(400, {"error": 'Send JSON like {"message": "..."}'})
              if len(text) > MAX_MESSAGE:
                  return reply(400, {"error": f"Keep the message under {MAX_MESSAGE} characters"})

              state = State(text)
              messages = [{"role": "user", "content": [{"text": text}]}]
              for _ in range(MAX_STEPS):
                  try:
                      response = bedrock.converse(
                          modelId=MODEL_ID,
                          messages=messages,
                          system=SYSTEM,
                          toolConfig=TOOL_CONFIG,
                          inferenceConfig={"maxTokens": 400, "temperature": 0.2},
                      )
                      message = response["output"]["message"]
                      stop_reason = response["stopReason"]
                  except Exception:
                      logger.exception("model call failed")
                      if state.used:  # work was started, so a person should hear about it
                          return hand_over(state, "model_error")
                      return reply(502, {"error": "The assistant is unavailable. Try again."})
                  messages.append(message)
                  if stop_reason != "tool_use":
                      logger.info("finished after %d tool calls", len(state.used))
                      return reply(
                          200,
                          {"answer": words(message), "steps": state.used, "escalated": state.escalated},
                      )
                  results = []
                  for block in message.get("content", []):
                      if "toolUse" in block:
                          state.used.append(block["toolUse"].get("name"))
                          results.append(run_tool(block["toolUse"], state))
                  if not results:
                      return hand_over(state, "no_tool_request")
                  messages.append({"role": "user", "content": results})

              return hand_over(state, "step_cap")
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  TriageIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HelpdeskApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt TriageFunction.Arn
      PayloadFormatVersion: "2.0"

  TriageRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HelpdeskApi
      RouteKey: POST /triage
      Target: !Sub "integrations/${TriageIntegration}"

  TriageInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref TriageFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HelpdeskApi}/*/POST/triage"

  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${Project}-${Environment}-site"
        Description: Signs CloudFront requests to the private site bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Helpdesk chat page and /ask
        Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api
            DomainName: !Sub "${HelpdeskApi}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
          # CachingOptimized
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /ask
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            # CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader: the API expects its own host name, not CloudFront's
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /tickets
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            # CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader: the API expects its own host name, not CloudFront's
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          - PathPattern: /triage
            TargetOriginId: api
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            # CachingDisabled
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # AllViewerExceptHostHeader: the API expects its own host name, not CloudFront's
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}"

  PolicyVectorBucket:
    Type: AWS::S3Vectors::VectorBucket
    Properties:
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  PolicyVectorIndex:
    Type: AWS::S3Vectors::Index
    Properties:
      VectorBucketArn: !GetAtt PolicyVectorBucket.VectorBucketArn
      DataType: float32
      # The default output size of the embedding model named by PolicyKnowledgeBase
      Dimension: 1024
      DistanceMetric: cosine
      MetadataConfiguration:
        NonFilterableMetadataKeys:
          - AMAZON_BEDROCK_TEXT
          - AMAZON_BEDROCK_METADATA
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  KnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*"
      Policies:
        - PolicyName: knowledge-base-permissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EmbedWithTheChosenModel
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
              - Sid: ListThePolicyBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: ReadThePolicyPages
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${SiteBucket.Arn}/policies/*"
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: UseTheVectorIndex
                Effect: Allow
                Action:
                  - s3vectors:PutVectors
                  - s3vectors:GetVectors
                  - s3vectors:DeleteVectors
                  - s3vectors:QueryVectors
                  - s3vectors:GetIndex
                Resource: !GetAtt PolicyVectorIndex.IndexArn
      Tags:
        - Key: chapter
          Value: session-06
        - Key: project
          Value: !Ref Project
        - Key: environment
          Value: !Ref Environment

  PolicyKnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    Properties:
      Name: !Sub "${Project}-${Environment}-policies"
      Description: IT policy pages
      RoleArn: !GetAtt KnowledgeBaseRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
      StorageConfiguration:
        Type: S3_VECTORS
        S3VectorsConfiguration:
          IndexArn: !GetAtt PolicyVectorIndex.IndexArn
      Tags:
        chapter: session-06
        project: !Ref Project
        environment: !Ref Environment

  PolicyDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !Ref PolicyKnowledgeBase
      Name: !Sub "${Project}-${Environment}-policy-pages"
      # Delete the vectors with the data source, so the vector bucket is empty when the stack goes
      DataDeletionPolicy: DELETE
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt SiteBucket.Arn
          InclusionPrefixes:
            - policies/

Outputs:
  AskUrl:
    Description: POST a JSON question here.
    Value: !Sub "${HelpdeskApi.ApiEndpoint}/ask"
  TicketsUrl:
    Description: POST a JSON message here to open or look up a ticket.
    Value: !Sub "${HelpdeskApi.ApiEndpoint}/tickets"
  TicketsTableName:
    Description: The DynamoDB table that holds the tickets.
    Value: !Ref TicketsTable
  TriageUrl:
    Description: POST a JSON message here to run the triage loop.
    Value: !Sub "${HelpdeskApi.ApiEndpoint}/triage"
  EscalationTopicArn:
    Description: The topic that emails the IT team. Confirm the subscription email first.
    Value: !Ref EscalationTopic
  ChatUrl:
    Description: Open this address to use the chat page.
    Value: !Sub "https://${SiteDistribution.DomainName}"
  SiteBucketName:
    Description: Upload app/web/index.html here.
    Value: !Ref SiteBucket
  KnowledgeBaseId:
    Description: The knowledge base the function asks.
    Value: !Ref PolicyKnowledgeBase
  DataSourceId:
    Description: Start an ingestion job for this data source after uploading policy pages.
    Value: !GetAtt PolicyDataSource.DataSourceId
  ModelInUse:
    Description: The id the function sends to Bedrock, the model id or its inference profile id.
    Value: !If
      - CallsInferenceProfile
      - !Join [".", [!If [RouteIsAuto, !FindInMap [RegionRoute, !Ref "AWS::Region", Route], !Ref ModelRoute], !Ref ModelId]]
      - !Ref ModelId
